
name: QuickCash Backend CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Unit Tests
        run: mvn --batch-mode --no-transfer-progress test

  mysql-integration-tests:
    name: MySQL Integration Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: quickcash_ci_test_only_2026
          MYSQL_DATABASE: quickcash_test_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pquickcash_ci_test_only_2026"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_PASSWORD: quickcash_ci_test_only_2026
      QUICKCASH_DB_TESTS: "true"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run MySQL Integration Tests
        run: mvn --batch-mode --no-transfer-progress -Dtest=QuickCashDatabaseIntegrationTest test
