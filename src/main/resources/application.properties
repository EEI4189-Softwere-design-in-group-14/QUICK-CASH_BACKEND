spring.application.name=quickcash-backend

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/quickcash_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Safe API error responses - Spring Boot 4
spring.web.error.include-stacktrace=never
spring.web.error.include-exception=false
spring.web.error.include-message=never
spring.web.error.include-binding-errors=never


# SMS provider selection
quickcash.sms.provider=${SMS_PROVIDER:mock}

# Automatic payment SMS dispatch
quickcash.sms.dispatch-enabled=${SMS_DISPATCH_ENABLED:false}

# Notify.lk configuration
quickcash.sms.notify.user-id=${NOTIFY_USER_ID:}
quickcash.sms.notify.api-key=${NOTIFY_API_KEY:}
quickcash.sms.notify.sender-id=${NOTIFY_SENDER_ID:}
# Check pending SMS every 30 seconds
quickcash.sms.poll-ms=30000
quickcash.sms.initial-delay-ms=10000
# TextBee SMS Gateway
quickcash.sms.textbee.api-key=${TEXTBEE_API_KEY:}
quickcash.sms.textbee.device-id=${TEXTBEE_DEVICE_ID:}
